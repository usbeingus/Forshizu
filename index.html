<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shizu</title>
  <style>
    :root { --bg: #050505; --card: #111111; --text: #ffffff; --muted: #888888; --yellow: #FFD700; --border: #333333; --green: #4CAF50; --red: #f44336; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
    
    #splash-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
    .splash-logo { font-size: 3.5rem; font-weight: 800; color: var(--yellow); animation: fadeIn 1s forwards; opacity: 0; }
    .fade-out { opacity: 0 !important; pointer-events: none; }
    @keyframes fadeIn { to { opacity: 1; } }

    #transition-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 9998; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    #transition-overlay.active { opacity: 1; pointer-events: all; }
    #transition-overlay img { width: 120px; height: 120px; object-fit: contain; }
    #transition-overlay.active img { animation: spinAndGrow 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    @keyframes spinAndGrow { 0% { transform: scale(0.6) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(1.5) rotate(360deg); opacity: 1; } }

    h1, h2, h3 { font-weight: 700; margin-top: 0; }
    h1 { color: var(--yellow); font-size: 2.2rem; margin-bottom: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 30px 20px; margin: 20px auto; position: relative; }
    
    .btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 16px; margin: 8px 0; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: 0.15s; position: relative; display: flex; justify-content: center; align-items: center; gap: 10px;}
    .btn:active { transform: scale(0.97); }
    .btn:hover:not(:disabled) { border-color: var(--yellow); color: var(--yellow); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-primary { background: var(--yellow); color: #000; border-color: var(--yellow); }
    .btn-primary:hover:not(:disabled) { background: #e6c200; }
    
    .input { padding: 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); width: 100%; font-size: 16px; margin-bottom: 15px; text-align: center; }
    .input:focus { outline: none; border-color: var(--yellow); }
    .hidden { display: none !important; }
    
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #555; margin-right: 8px; transition: 0.3s; }
    .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .unread-dot { position: absolute; top: -5px; right: -5px; width: 12px; height: 12px; background: var(--red); border-radius: 50%; display: none; border: 2px solid var(--bg); }
    
    .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--yellow); margin-bottom: 15px; display: inline-block; background: #333; }

    .question { font-size: 1.4rem; margin: 20px 0; font-weight: 600; line-height: 1.4; min-height: 60px;}
    
    .result-card { background: var(--bg); border: 2px solid var(--yellow); border-radius: 8px; padding: 20px; margin-top: 20px; text-align: left; }
    .result-match { font-size: 22px; font-weight: 800; color: var(--yellow); text-align: center; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px; }
    
    .chat-box { height: 350px; overflow-y: auto; background: var(--bg); border-radius: 6px; padding: 15px; margin-bottom: 15px; text-align: left; display: flex; flex-direction: column; border: 1px solid var(--border); }
    .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 6px; max-width: 85%; font-size: 14px; line-height: 1.4; position: relative; }
    .msg-me { background: var(--border); align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-other { background: #1a1a1a; border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg-meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: block; }
    .chat-input-container { display: flex; gap: 10px; }
    .chat-input-container input { margin-bottom: 0; text-align: left; }
    .chat-input-container button { width: auto; padding: 16px 20px; margin: 0; }

    .settings-link { color: var(--muted); text-decoration: none; font-size: 13px; margin-top: 20px; display: inline-block; border-bottom: 1px dashed var(--muted); padding-bottom: 2px; }
  </style>
</head>
<body>

<div id="splash-screen"><h1 class="splash-logo">Shizu</h1></div>
<div id="transition-overlay"><img src="animation.png" alt="Loading..."></div>
<input type="file" id="avatarUpload" accept="image/*" class="hidden" onchange="window.handleImageUpload(event)">

<div class="container">
  <h1>Shizu</h1>

  <div id="page-auth" class="card hidden">
    <h2 id="authTitle">Login</h2>
    <input type="text" id="username" class="input" placeholder="Username" style="text-transform:none;" />
    <input type="password" id="password" class="input" placeholder="Password" style="text-transform:none;" />
    <button class="btn btn-primary" onclick="window.handleAuth()" id="authBtn">Login</button>
    <p style="margin-top: 20px; font-size: 14px; color: var(--muted);">
      <span id="authSwitchText">New here?</span> 
      <a href="#" onclick="window.toggleAuth(event)" style="color: var(--yellow); text-decoration: none; font-weight: 600;" id="authSwitchLink">Sign up</a>
    </p>
  </div>

  <div id="page-pairing" class="card hidden">
    <h2>Pair</h2>
    <p style="color: var(--muted);">Send this 6-digit code to your partner:</p>
    <div id="myPairCode" style="display:inline-block; border:1px solid var(--yellow); color:var(--yellow); padding:12px 24px; border-radius:6px; font-size:24px; font-weight:700; letter-spacing:4px; margin:15px 0;">------</div>
    <hr style="border-color: var(--border); margin: 30px 0;">
    <p style="color: var(--muted);">Or enter their Username:</p>
    <input type="text" id="partnerCodeInput" class="input" placeholder="USERNAME OR CODE" style="text-transform:none;" />
    <button class="btn" onclick="window.linkPartner()">Link Accounts</button>
    <p id="pairingStatus" style="color: var(--yellow); margin-top: 15px; font-size: 14px;"></p>
  </div>

  <div id="page-lobby" class="card hidden">
    <h2>Connected</h2>
    <img id="partnerAvatarDisplay" class="avatar" src="" alt="Partner" style="display:none;">
    <div id="partnerAvatarFallback" class="avatar" style="display:flex; justify-content:center; align-items:center; font-size:32px;">👤</div>
    
    <p style="color: var(--muted); margin-bottom: 5px;">Playing with:</p>
    <p style="font-size: 1.5rem; font-weight: 700; margin-top: 0; margin-bottom: 30px; color: var(--yellow);">
      <span id="partnerStatusDot" class="status-dot"></span>
      <span id="partnerNameDisplay">...</span>
    </p>
    
    <div id="hostControls">
      <div style="margin: 20px 0; font-size: 14px;">
        <label style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <input type="checkbox" id="spicyToggle" style="transform: scale(1.2); accent-color: var(--yellow);"> 
          <span style="color: var(--yellow); font-weight: 600;">Spicy Mode</span>
        </label>
      </div>
      <button class="btn" onclick="window.startGame('moreLikely')">Who is more likely to...</button>
      <button class="btn" onclick="window.startGame('neverHaveIEver')">Never Have I Ever</button>
      <button class="btn" onclick="window.startGame('thisOrThat')">This or That</button>
      <button class="btn btn-primary" onclick="window.goToLudo()" style="margin-top: 15px;">🎲 Play Ludo</button>
    </div>
    
    <div id="guestControls" class="hidden">
      <p style="color: var(--muted); margin-top: 30px;">Waiting for host to start...</p>
    </div>

    <button class="btn" onclick="window.openChat()" style="margin-top: 20px;">
      💬 Open Chat <span id="lobbyUnreadDot" class="unread-dot"></span>
    </button>
    
    <br>
    <a href="#" onclick="document.getElementById('avatarUpload').click()" class="settings-link">Upload My Photo</a>
    <span style="color: var(--border); margin: 0 10px;">|</span>
    <a href="#" onclick="window.leavePartner()" class="settings-link">Change Partner</a>
    <br><br>
    <a href="#" onclick="window.logout()" class="logout-link" style="color: var(--muted); text-decoration: none; font-size: 13px;">Log out</a>
  </div>

  <div id="page-game" class="card hidden">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
      <div id="roundBadge" style="color:var(--muted); font-weight:bold;">ROUND 1</div>
    </div>
    <div id="questionDisplay" class="question">Loading...</div>
    <div id="voteButtonsContainer"></div>
    <div id="resultContainer" class="hidden"></div>
    <div id="myVoteStatus" style="margin-top: 20px; font-size: 14px; color: var(--yellow); font-weight: 600;"></div>
    <button class="btn" onclick="window.leaveGame()" style="margin-top: 20px; background: transparent; border-color: #555; color: #aaa;">Leave Game</button>
  </div>

  <div id="page-chat" class="card hidden">
    <h2>Chat</h2>
    <div id="chatBox" class="chat-box"></div>
    <div class="chat-input-container">
      <input type="text" id="chatInput" class="input" placeholder="Type a message..." onkeypress="window.handleChatEnter(event)">
      <button class="btn btn-primary" onclick="window.sendChat()">Send</button>
    </div>
    <br>
    <button class="btn" onclick="window.closeChat()">Back</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, addDoc, query, orderBy, serverTimestamp, getDocs, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAQg9F4Sn3GsZOghWxSJqwbLMsJetvo03w",
    authDomain: "shizu-c984a.firebaseapp.com",
    projectId: "shizu-c984a",
    storageBucket: "shizu-c984a.firebasestorage.app",
    messagingSenderId: "512395203618",
    appId: "1:512395203618:web:496a2f959a3545975c667b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx9DwCUGQtAfTHcPGj62BIyvUhIz-NH4jpx6_jZV8e_DlqRw4J0jdJsB9nQHPXIUgVN4g/exec";

  let currentUser = '', roomId = '', partnerName = '', isHost = false;
  let currentMode = 'moreLikely', currentQuestionText = '', currentRound = 0;
  let currentQuestions = [];
  let localVotes = [];
  let lastPageBeforeChat = 'page-lobby';
  let isSignupMode = false;
  let unsubRoom, unsubVotes, unsubChat, unsubPartner;

  window.onload = () => {
    setTimeout(() => {
      document.getElementById('splash-screen').classList.add('fade-out');
      setTimeout(() => {
        document.getElementById('splash-screen').style.display = 'none';
        const savedUser = localStorage.getItem('shizu_user');
        const savedPass = localStorage.getItem('shizu_pass');
        if (savedUser && savedPass) checkLogin(savedUser, savedPass);
        else showPage('page-auth');
      }, 500);
    }, 1500);
  };

  function showPage(pageId) {
    ['page-auth', 'page-pairing', 'page-lobby', 'page-game', 'page-chat'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
    document.getElementById(pageId).classList.remove('hidden');
  }

  function vibrate() { if (navigator.vibrate) navigator.vibrate(50); }

  function toggleAuth(e) {
    if(e) e.preventDefault(); 
    isSignupMode = !isSignupMode;
    document.getElementById('authTitle').innerText = isSignupMode ? 'Create Account' : 'Login';
    document.getElementById('authBtn').innerText = isSignupMode ? 'Sign Up' : 'Login';
    document.getElementById('authSwitchText').innerText = isSignupMode ? 'Already have an account?' : "New here?";
    document.getElementById('authSwitchLink').innerText = isSignupMode ? 'Login' : 'Sign up';
  }

  async function handleAuth() {
    vibrate();
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    if (!user || !pass) return alert('Please fill both fields.');

    if (isSignupMode) {
      const userRef = doc(db, "users", user.toLowerCase());
      const userSnap = await getDoc(userRef);
      if (userSnap.exists()) return alert('Username taken.');
      
      const pairCode = Math.floor(100000 + Math.random() * 900000).toString();
      await setDoc(userRef, { displayName: user, password: pass, pairCode: pairCode, partner: '', roomId: '', avatar: '' });
      
      localStorage.setItem('shizu_user', user);
      localStorage.setItem('shizu_pass', pass);
      currentUser = user;
      document.getElementById('myPairCode').innerText = pairCode;
      showPage('page-pairing');
    } else {
      checkLogin(user, pass);
    }
  }

  async function checkLogin(user, pass) {
    const userRef = doc(db, "users", user.toLowerCase());
    const userSnap = await getDoc(userRef);
    
    if (userSnap.exists() && userSnap.data().password === pass) {
      localStorage.setItem('shizu_user', user);
      localStorage.setItem('shizu_pass', pass);
      currentUser = user;
      const data = userSnap.data();

      if (!data.roomId) {
        document.getElementById('myPairCode').innerText = data.pairCode;
        showPage('page-pairing');
      } else {
        roomId = data.roomId;
        partnerName = data.partner;
        enterLobby();
      }
    } else {
      alert('Invalid credentials.'); showPage('page-auth');
    }
  }

  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    document.getElementById('partnerAvatarFallback').innerText = "⏳";

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_SIZE = 150;
        let width = img.width, height = img.height;
        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } }
        else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        
        updateDoc(doc(db, "users", currentUser.toLowerCase()), { avatar: dataUrl })
          .then(() => alert("Photo updated!"))
          .catch(err => alert("Error uploading: " + err.message));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function linkPartner() {
    vibrate();
    const input = document.getElementById('partnerCodeInput').value.trim();
    if (!input) return alert('Enter username or code.');
    document.getElementById('pairingStatus').innerText = "Linking...";
    
    let partnerRef = doc(db, "users", input.toLowerCase());
    let partnerSnap = await getDoc(partnerRef);
    
    if (!partnerSnap.exists()) {
      const q = query(collection(db, "users"), where("pairCode", "==", input));
      const qSnap = await getDocs(q);
      if (!qSnap.empty) { partnerSnap = qSnap.docs[0]; partnerRef = partnerSnap.ref; }
    }

    if (!partnerSnap.exists()) {
      document.getElementById('pairingStatus').innerText = "";
      return alert('Partner not found.');
    }

    const pData = partnerSnap.data();
    if (pData.displayName.toLowerCase() === currentUser.toLowerCase()) return alert('Cannot pair with yourself.');
    if (pData.roomId) return alert('That person is already paired with someone.');

    const names = [currentUser.toLowerCase(), pData.displayName.toLowerCase()].sort();
    const newRoomId = names[0] + "_" + names[1];
    const myRef = doc(db, "users", currentUser.toLowerCase());
    
    await updateDoc(myRef, { partner: pData.displayName, roomId: newRoomId });
    await updateDoc(partnerRef, { partner: currentUser, roomId: newRoomId });

    roomId = newRoomId;
    partnerName = pData.displayName;
    enterLobby();
  }

  async function leavePartner() {
    vibrate();
    if(!confirm("Unlink from " + partnerName + "?")) return;
    await updateDoc(doc(db, "users", currentUser.toLowerCase()), { partner: '', roomId: '' });
    await updateDoc(doc(db, "users", partnerName.toLowerCase()), { partner: '', roomId: '' });
    if (unsubRoom) unsubRoom();
    if (unsubPartner) unsubPartner();
    document.getElementById('partnerCodeInput').value = '';
    document.getElementById('myPairCode').innerText = (await getDoc(doc(db, "users", currentUser.toLowerCase()))).data().pairCode;
    showPage('page-pairing');
  }

  function enterLobby() {
    localStorage.setItem('shizu_room', roomId);
    localStorage.setItem('shizu_partner', partnerName);
    
    document.getElementById('partnerNameDisplay').innerText = partnerName;
    isHost = (currentUser.toLowerCase() < partnerName.toLowerCase());
    document.getElementById('hostControls').classList.toggle('hidden', !isHost);
    document.getElementById('guestControls').classList.toggle('hidden', isHost);
    showPage('page-lobby');

    if (unsubPartner) unsubPartner();
    unsubPartner = onSnapshot(doc(db, "users", partnerName.toLowerCase()), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.avatar) {
            document.getElementById('partnerAvatarDisplay').src = data.avatar;
            document.getElementById('partnerAvatarDisplay').style.display = 'inline-block';
            document.getElementById('partnerAvatarFallback').style.display = 'none';
        } else {
            document.getElementById('partnerAvatarDisplay').style.display = 'none';
            document.getElementById('partnerAvatarFallback').style.display = 'flex';
        }
      }
    });
  }

  function goToLudo() {
      vibrate();
      window.location.href = "ludo.html";
  }

  async function startGame(mode) {
    vibrate();
    const isSpicy = document.getElementById('spicyToggle').checked;
    currentMode = mode;
    document.getElementById('questionDisplay').innerText = "Fetching questions...";
    showPage('page-game');

    let questions = [];
    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'fetchQuestions', mode: mode, spice: isSpicy ? 'spicy' : 'normal' })
      });
      const data = await res.json();
      if (data && data.questions && data.questions.length > 0) questions = data.questions;
    } catch(e) { console.log(e); }

    if (questions.length < 10) {
        alert("Not enough questions in the Google Sheet yet. Please wait a minute and try again.");
        showPage('page-lobby');
        return;
    }
    
    questions = questions.sort(() => 0.5 - Math.random());
    currentQuestions = questions.slice(0, 10);
    currentRound = 1;
    currentQuestionText = currentQuestions[0];
    
    await setDoc(doc(db, "rooms", roomId), {
      gameState: { mode: mode, round: 1, question: currentQuestions[0], status: 'playing', host: currentUser }
    }, { merge: true });
    
    setupVotesListener();
    loadQuestionUI();
  }

  function setupVotesListener() {
    if (unsubVotes) unsubVotes();
    unsubVotes = onSnapshot(collection(db, "rooms", roomId, "votes"), (snapshot) => {
      localVotes = [];
      snapshot.forEach(doc => { if(doc.data().round === currentRound) localVotes.push(doc.data()); });
      
      if (localVotes.length >= 2) {
        showRoundResult(localVotes);
        if (isHost) checkIfNextQuestionReady();
      }
    });
  }

  function showRoundResult(votes) {
    document.getElementById('voteButtonsContainer').classList.add('hidden');
    const myVoteObj = votes.find(v => v.voter === currentUser);
    const partnerVoteObj = votes.find(v => v.voter === partnerName);
    const myChoice = myVoteObj ? myVoteObj.target : "?";
    const partnerChoice = partnerVoteObj ? partnerVoteObj.target : "?";
    const isMatch = myChoice === partnerChoice;

    document.getElementById('resultContainer').classList.remove('hidden');
    document.getElementById('resultContainer').innerHTML = `
      <div class="result-card">
        <div class="result-row">You: <b>${myChoice}</b> | ${partnerName}: <b>${partnerChoice}</b></div>
        <div class="result-match">${isMatch ? 'MATCH!' : 'Different choices!'}</div>
      </div>
    `;
  }

  async function checkIfNextQuestionReady() {
    if (window.isAdvancing) return;
    window.isAdvancing = true;

    setTimeout(async () => {
      if (currentRound >= 10) {
        await updateDoc(doc(db, "rooms", roomId), { "gameState.status": "finished" });
      } else {
        const nextQ = currentQuestions[currentRound];
        await updateDoc(doc(db, "rooms", roomId), { "gameState.round": currentRound + 1, "gameState.question": nextQ });
      }
      window.isAdvancing = false;
    }, 4000); 
  }

  function loadQuestionUI() {
    const overlay = document.getElementById('transition-overlay');
    overlay.classList.add('active');
    setTimeout(() => {
      document.getElementById('roundBadge').innerText = `ROUND ${currentRound} OF 10`;
      document.getElementById('questionDisplay').innerText = currentQuestionText;
      document.getElementById('voteButtonsContainer').classList.remove('hidden');
      document.getElementById('resultContainer').classList.add('hidden');
      buildVoteButtons();
      setTimeout(() => { overlay.classList.remove('active'); }, 200);
    }, 1200);
  }

  function buildVoteButtons() {
    const container = document.getElementById('voteButtonsContainer');
    container.innerHTML = '';
    if (currentMode === 'moreLikely') {
      [currentUser, partnerName].forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-vote'; btn.innerText = p;
        btn.onclick = () => submitVote(p);
        container.appendChild(btn);
      });
    } else if (currentMode === 'neverHaveIEver') {
      const b1 = document.createElement('button'); b1.className = 'btn btn-vote'; b1.innerText = 'I have'; b1.onclick = () => submitVote('True');
      const b2 = document.createElement('button'); b2.className = 'btn btn-vote'; b2.innerText = 'I haven\'t'; b2.onclick = () => submitVote('False');
      container.appendChild(b1); container.appendChild(b2);
    } else if (currentMode === 'thisOrThat') {
      let opt1 = 'A', opt2 = 'B';
      if (currentQuestionText.includes(':')) {
        let text = currentQuestionText.split(':')[1].trim().replace(/\?$/, '');
        let parts = text.split(' or ');
        if (parts.length >= 2) { opt1 = parts[0].trim(); opt2 = parts[1].trim(); }
      }
      const b1 = document.createElement('button'); b1.className = 'btn btn-vote'; b1.innerText = opt1; b1.onclick = () => submitVote(opt1);
      const b2 = document.createElement('button'); b2.className = 'btn btn-vote'; b2.innerText = opt2; b2.onclick = () => submitVote(opt2);
      container.appendChild(b1); container.appendChild(b2);
    }
  }

  async function submitVote(target) {
    vibrate();
    document.getElementById('myVoteStatus').innerText = `You picked: ${target}`;
    document.querySelectorAll('.btn-vote').forEach(b => b.disabled = true);
    await setDoc(doc(db, "rooms", roomId, "votes", `round_${currentRound}_${currentUser}`), {
      round: currentRound, voter: currentUser, target: target
    });
  }

  async function openChat() {
    vibrate();
    lastPageBeforeChat = document.getElementById('page-game').classList.contains('hidden') ? 'page-lobby' : 'page-game';
    showPage('page-chat');
    if (unsubChat) unsubChat();
    unsubChat = onSnapshot(query(collection(db, "rooms", roomId, "messages"), orderBy("time")), (snapshot) => {
      const box = document.getElementById('chatBox');
      box.innerHTML = '';
      snapshot.forEach(doc => {
        const m = doc.data();
        const div = document.createElement('div');
        div.className = 'msg ' + (m.user === currentUser ? 'msg-me' : 'msg-other');
        div.innerHTML = `<span class="msg-meta">${m.user}</span>${m.text}`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    });
  }

  function closeChat() { vibrate(); showPage(lastPageBeforeChat); }

  async function sendChat() {
    const input = document.getElementById('chatInput');
    if (!input.value.trim()) return;
    await addDoc(collection(db, "rooms", roomId, "messages"), { user: currentUser, text: input.value.trim(), time: serverTimestamp() });
    input.value = '';
  }

  function handleChatEnter(e) { if (e.key === 'Enter') sendChat(); }

  function leaveGame() {
      vibrate();
      showPage('page-lobby');
  }

  function logout() {
    localStorage.removeItem('shizu_user'); localStorage.removeItem('shizu_pass'); localStorage.removeItem('shizu_room'); localStorage.removeItem('shizu_partner');
    window.location.reload();
  }

  window.toggleAuth = toggleAuth; window.handleAuth = handleAuth; window.linkPartner = linkPartner; window.leavePartner = leavePartner;
  window.startGame = startGame; window.openChat = openChat; window.closeChat = closeChat; window.sendChat = sendChat;
  window.leaveGame = leaveGame; window.logout = logout; window.handleImageUpload = handleImageUpload; window.goToLudo = goToLudo;
  window.handleChatEnter = handleChatEnter;

</script>
</body>
</html>
