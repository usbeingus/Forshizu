<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shizu Ludo</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root { 
      --bg: #100B12; --bg-sec: #19111C; --card: #211722; 
      --primary: #E879A5; --secondary: #B96A91; --text: #F8EAF0; 
      --muted: #A99AA5; --border: rgba(232, 121, 165, 0.16); --green: #4CAF50;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    
    body { 
      font-family: 'Inter', sans-serif; text-align: center; padding: 20px; 
      background: var(--bg); color: var(--text); margin: 0; 
      overflow-x: hidden; min-height: 100dvh; display: flex; 
      flex-direction: column; justify-content: center;
    }

    h1 { font-family: 'Playfair Display', serif; color: var(--primary); font-size: 2.2rem; margin-bottom: 5px; }
    .container { max-width: 450px; margin: 0 auto; width: 100%; }
    .status-text { color: var(--primary); font-weight: 600; font-size: 1.1rem; margin-bottom: 20px; min-height: 25px; }
    
    .btn { 
      background: transparent; color: var(--text); border: 1px solid var(--border); 
      padding: 16px; margin: 8px 0; border-radius: 12px; font-family: 'Inter', sans-serif;
      font-size: 16px; font-weight: 500; cursor: pointer; width: 100%; 
      transition: all 0.2s ease; min-height: 44px;
    }
    .btn:active { transform: scale(0.97); }
    
    .board-wrapper {
      position: relative; width: 100%; aspect-ratio: 1;
      border: 2px solid var(--border); border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; margin-bottom: 20px;
      background-color: #111;
    }

    .board-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('ludo-board.jpg'); background-size: cover;
      background-position: center; z-index: 1;
    }

    .piece {
      position: absolute;
      width: 8%; /* Bug Fix: Shrunk to 8% */
      height: 12%; 
      cursor: pointer;
      transition: left 0.15s linear, top 0.15s linear; /* Smooth sliding */
      z-index: 10;
      transform: translate(-50%, -85%); 
    }

    /* Bug Fix: Separate inner div for bob animation */
    .piece-inner {
      width: 100%; height: 100%; position: relative;
    }

    .piece::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('red-piece.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      z-index: 1;
      pointer-events: none;
    }

    .piece-green::before { filter: hue-rotate(120deg) saturate(1.5); }

    .piece-avatar {
      position: absolute;
      top: 13%;
      left: 50%;
      transform: translateX(-50%);
      width: 46%; 
      aspect-ratio: 1; 
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      background-color: #222;
      z-index: 2;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.8);
    }

    /* Bug Fix: Bob animation instead of scale conflict */
    .piece.my-turn .piece-inner { 
        animation: bob 0.8s ease-in-out infinite;
        box-shadow: 0 0 15px var(--primary); 
        border-radius: 50%;
    }
    @keyframes bob {
        50% { transform: translateY(-15%) scale(1.1); }
    }

    .dice-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 10px; }
    .dice { 
      width: 70px; height: 70px; background: var(--bg-sec); color: var(--primary); 
      border: 2px solid var(--border); font-size: 36px; border-radius: 12px; 
      display: flex; justify-content: center; align-items: center; cursor: pointer; 
      box-shadow: 0 5px 0 var(--card); transition: 0.1s; 
    }
    
    .dice.rolling { animation: rollDiceAnim 0.5s infinite; }
    @keyframes rollDiceAnim {
        0% { transform: rotate(0deg) scale(1); }
        25% { transform: rotate(-15deg) scale(1.1); }
        50% { transform: rotate(15deg) scale(0.9); }
        75% { transform: rotate(-10deg) scale(1.05); }
        100% { transform: rotate(0deg) scale(1); }
    }

    .dice:active:not(.disabled) { transform: translateY(5px); box-shadow: 0 0 0 var(--card); }
    .dice.disabled { opacity: 0.5; cursor: not-allowed; background: var(--card); }
    #diceResult { color: var(--muted); font-weight: 600; font-size: 1.2rem; width: 80px; text-align: left; }
    
    .bottom-controls { display: flex; gap: 10px; margin-top: 20px; }
    .bottom-controls .btn { margin: 0; }

    /* Bug Fix: Missing hidden class */
    .hidden { display: none !important; }

    #customModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; pointer-events: none; transition: 0.2s; }
    #customModal.active { opacity: 1; pointer-events: all; }
    .modal-box { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 16px; width: 80%; max-width: 300px; text-align: center; transform: scale(0.9); transition: 0.2s; }
    #customModal.active .modal-box { transform: scale(1); }
    .modal-box h3 { color: var(--primary); margin-bottom: 10px; }
    .modal-box p { color: var(--text); font-size: 14px; margin-bottom: 20px; }
    .modal-box .btn { margin: 5px 0; }
  </style>
</head>
<body>

<div id="customModal">
    <div class="modal-box">
        <h3 id="modalTitle">Alert</h3>
        <p id="modalMessage">Message</p>
        <button class="btn" id="modalConfirmBtn" onclick="closeModal(true)">OK</button>
        <button class="btn hidden" id="modalCancelBtn" onclick="closeModal(false)">Cancel</button>
    </div>
</div>

<div class="container">
  <h1>Ludo</h1>
  <div class="status-text" id="ludoTurnText">Loading...</div>
  
  <div class="board-wrapper">
    <div class="board-bg"></div>
    <div id="pieces-container"></div>
  </div>
  
  <div class="dice-container">
    <div class="dice" id="diceBtn" onclick="rollDice()">🎲</div>
    <div id="diceResult"></div>
  </div>

  <div class="bottom-controls">
      <button class="btn" onclick="restartLudo()" style="color: var(--primary); border-color: var(--primary);">Restart Board</button>
      <button class="btn" onclick="leaveLudo()" style="color: var(--muted);">Leave</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAQg9F4Sn3GsZOghWxSJqwbLMsJetvo03w",
    authDomain: "shizu-c984a.firebaseapp.com",
    projectId: "shizu-c984a",
    storageBucket: "shizu-c984a.firebasestorage.app",
    messagingSenderId: "512395203618",
    appId: "1:512395203618:web:496a2f959a3545975c667b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const currentUser = localStorage.getItem('shizu_user');
  const roomId = localStorage.getItem('shizu_room');
  const partnerName = localStorage.getItem('shizu_partner');
  
  // Bug Fix: Added return after redirect
  if (!currentUser || !roomId) {
      window.location.href = "index.html";
      throw new Error("Redirecting to index...");
  }

  const isHost = currentUser.toLowerCase() < partnerName.toLowerCase();
  const myColor = isHost ? 'red' : 'green';
  const oppColor = isHost ? 'green' : 'red';

  let myAvatar = '', oppAvatar = '';
  let ludoState = {};
  let unsubLudo, unsubUsers;
  let isRolling = false;
  let isProcessing = false;
  let shownPositions = {}; // For smooth step-by-step animation

  // Bug Fix: 52-cell path
  const TRACK = [
    ...[2,3,4,5,6].map(c=>({r:7,c})), ...[6,5,4,3,2,1].map(r=>({r,c:7})), {r:1,c:8},
    ...[1,2,3,4,5,6].map(r=>({r,c:9})), ...[10,11,12,13,14,15].map(c=>({r:7,c})), {r:8,c:15},
    ...[15,14,13,12,11,10].map(c=>({r:9,c})), ...[10,11,12,13,14,15].map(r=>({r,c:9})), {r:15,c:8},
    ...[15,14,13,12,11,10].map(r=>({r,c:7})), ...[6,5,4,3,2,1].map(c=>({r:9,c})), {r:8,c:1},{r:7,c:1}
  ]; 

  const HOME_RED   = [2,3,4,5,6].map(c=>({r:8,c}));
  const HOME_GREEN = [14,13,12,11,10].map(c=>({r:8,c}));

  const BASE_RED = [{r:2.5, c:2.5}, {r:2.5, c:4.5}, {r:4.5, c:2.5}, {r:4.5, c:4.5}];
  const BASE_GREEN = [{r:11.5, c:11.5}, {r:11.5, c:13.5}, {r:13.5, c:11.5}, {r:13.5, c:13.5}];

  async function initGame() {
    const gameRef = doc(db, "rooms", roomId, "games", "ludo");
    const gameSnap = await getDoc(gameRef);
    
    // Only reset if it doesn't exist. Do not auto-reset if winner exists.
    if (!gameSnap.exists()) {
      await setDoc(gameRef, {
        turn: isHost ? currentUser : partnerName,
        dice: 0,
        hasRolled: false,
        sixCount: 0,
        red: { p1: -1, p2: -1, p3: -1, p4: -1 },
        green: { p1: -1, p2: -1, p3: -1, p4: -1 },
        winner: null
      });
    }

    unsubUsers = onSnapshot(doc(db, "users", currentUser.toLowerCase()), (snap) => {
        if(snap.exists() && snap.data().avatar) myAvatar = snap.data().avatar;
        renderBoard();
    });
    onSnapshot(doc(db, "users", partnerName.toLowerCase()), (snap) => {
        if(snap.exists() && snap.data().avatar) oppAvatar = snap.data().avatar;
        renderBoard();
    });

    unsubLudo = onSnapshot(gameRef, (docSnap) => {
      if (docSnap.exists()) {
        ludoState = docSnap.data();
        renderBoard();
      }
    });
  }

  function showModal(title, msg, isConfirm = false) {
      return new Promise((resolve) => {
          document.getElementById('modalTitle').innerText = title;
          document.getElementById('modalMessage').innerText = msg;
          document.getElementById('customModal').classList.add('active');
          
          const confirmBtn = document.getElementById('modalConfirmBtn');
          const cancelBtn = document.getElementById('modalCancelBtn');
          
          if (isConfirm) {
              cancelBtn.classList.remove('hidden');
          } else {
              cancelBtn.classList.add('hidden');
          }
          
          window.closeModal = (result) => {
              document.getElementById('customModal').classList.remove('active');
              resolve(result);
          };
      });
  }

  async function restartLudo() {
      const confirmed = await showModal("Restart Board", "Are you sure? All progress will be lost.", true);
      if(confirmed) {
          await setDoc(doc(db, "rooms", roomId, "games", "ludo"), {
              turn: isHost ? currentUser : partnerName,
              dice: 0,
              hasRolled: false,
              sixCount: 0,
              red: { p1: -1, p2: -1, p3: -1, p4: -1 },
              green: { p1: -1, p2: -1, p3: -1, p4: -1 },
              winner: null
          });
      }
  }

  function renderBoard() {
    const container = document.getElementById('pieces-container');
    if (!container || !ludoState.red) return;
    
    if (container.children.length === 0) {
        for (let p in ludoState.red) createPieceElement('red', p);
        for (let p in ludoState.green) createPieceElement('green', p);
    }

    for (let p in ludoState.red) {
      let pos = ludoState.red[p];
      let gridPos;
      if (pos === -1) gridPos = BASE_RED[parseInt(p.slice(1))-1];
      else if (pos >= 0 && pos <= 50) gridPos = TRACK[pos]; 
      else if (pos >= 51 && pos <= 55) gridPos = HOME_RED[pos - 51];
      else gridPos = HOME_RED[4]; // Finish
      
      animateTo('red', p, pos, gridPos);
    }

    for (let p in ludoState.green) {
      let pos = ludoState.green[p];
      let gridPos;
      if (pos === -1) gridPos = BASE_GREEN[parseInt(p.slice(1))-1];
      else if (pos >= 0 && pos <= 50) gridPos = TRACK[(pos + 26) % 52]; 
      else if (pos >= 51 && pos <= 55) gridPos = HOME_GREEN[pos - 51];
      else gridPos = HOME_GREEN[4]; // Finish
      
      animateTo('green', p, pos, gridPos);
    }

    const diceBtn = document.getElementById('diceBtn');
    if (ludoState.winner) {
      document.getElementById('ludoTurnText').innerText = `🏆 ${ludoState.winner} Wins!`;
      diceBtn.classList.add('disabled');
    } else if (ludoState.turn === currentUser) {
      document.getElementById('ludoTurnText').innerText = "Your Turn!";
      diceBtn.classList.toggle('disabled', ludoState.hasRolled || isRolling || isProcessing);
    } else {
      document.getElementById('ludoTurnText').innerText = `Waiting for ${partnerName}...`;
      diceBtn.classList.add('disabled');
    }
    
    if (ludoState.dice > 0 && !isRolling) {
        document.getElementById('diceResult').innerText = `Rolled: ${ludoState.dice}`;
        document.getElementById('diceBtn').innerText = ludoState.dice;
    } else if (ludoState.dice === 0) {
        document.getElementById('diceResult').innerText = "";
        document.getElementById('diceBtn').innerText = "🎲";
    }
  }

  // Bug Fix: Step-by-step movement
  async function animateTo(color, pieceId, toPos, finalGridPos) {
      const key = color + pieceId;
      const fromPos = shownPositions[key] ?? toPos;
      shownPositions[key] = toPos;

      if (fromPos < 0 || toPos <= fromPos || (toPos - fromPos) > 6) {
          // Jump directly (capture, roll 6 out of base, or large gap)
          updatePieceElement(color, pieceId, finalGridPos);
          return;
      }

      // Step-by-step
      const isRed = color === 'red';
      for (let p = fromPos + 1; p <= toPos; p++) {
          let stepGridPos;
          if (p <= 50) stepGridPos = isRed ? TRACK[p] : TRACK[(p + 26) % 52];
          else if (p <= 55) stepGridPos = isRed ? HOME_RED[p - 51] : HOME_GREEN[p - 51];
          else stepGridPos = isRed ? HOME_RED[4] : HOME_GREEN[4];
          
          updatePieceElement(color, pieceId, stepGridPos);
          await new Promise(r => setTimeout(r, 150));
      }
  }

  function createPieceElement(color, pieceId) {
    const el = document.createElement('div');
    el.id = `piece-${color}-${pieceId}`;
    el.className = `piece piece-${color}`;
    
    const inner = document.createElement('div');
    inner.className = 'piece-inner';
    
    const avatarDiv = document.createElement('div');
    avatarDiv.className = 'piece-avatar';
    inner.appendChild(avatarDiv);
    el.appendChild(inner);

    el.onclick = () => handlePieceClick(color, pieceId);
    document.getElementById('pieces-container').appendChild(el);
  }

  function updatePieceElement(color, pieceId, gridPos) {
    const el = document.getElementById(`piece-${color}-${pieceId}`);
    if (!el) return;

    el.style.left = `${((gridPos.c - 0.5) / 15) * 100}%`;
    el.style.top = `${((gridPos.r - 0.5) / 15) * 100}%`;

    let imageToUse = '';
    if (color === 'red' && myColor === 'red') imageToUse = myAvatar;
    if (color === 'red' && oppColor === 'red') imageToUse = oppAvatar;
    if (color === 'green' && myColor === 'green') imageToUse = myAvatar;
    if (color === 'green' && oppColor === 'green') imageToUse = oppAvatar;

    const avatarDiv = el.querySelector('.piece-avatar');
    if (imageToUse) {
      avatarDiv.style.backgroundImage = `url("${imageToUse}")`;
    }

    if (color === myColor && ludoState.turn === currentUser && ludoState.hasRolled && !ludoState.winner) {
        el.classList.add('my-turn');
    } else {
        el.classList.remove('my-turn');
    }
  }

  async function rollDice() {
    if (ludoState.turn !== currentUser || ludoState.hasRolled || isRolling || isProcessing) return;
    
    isRolling = true;
    const diceBtn = document.getElementById('diceBtn');
    
    diceBtn.classList.add('rolling');
    diceBtn.classList.add('disabled');
    
    let animInterval = setInterval(() => {
        diceBtn.innerText = Math.floor(Math.random() * 6) + 1;
    }, 80);

    setTimeout(async () => {
        clearInterval(animInterval);
        diceBtn.classList.remove('rolling');
        isRolling = false;

        const newDice = Math.floor(Math.random() * 6) + 1;
        
        let newSixCount = ludoState.sixCount || 0;
        if (newDice === 6) newSixCount++;
        else newSixCount = 0;

        if (newSixCount === 3) {
            await showModal("Three 6s!", "You rolled three 6s in a row. Your turn is skipped.");
            await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), { dice: newDice, hasRolled: true, sixCount: 0 });
            setTimeout(passTurn, 1000);
            return;
        }

        const myPieces = ludoState[myColor];
        let hasValidMove = false;
        
        for (let p in myPieces) {
          const pos = myPieces[p];
          if (pos === -1 && newDice === 6) hasValidMove = true;
          else if (pos >= 0 && pos + newDice <= 56) hasValidMove = true;
        }
        
        if (!hasValidMove) {
          document.getElementById('ludoTurnText').innerText = "No valid moves. Passing...";
          await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), { dice: newDice, hasRolled: true, sixCount: newSixCount });
          setTimeout(passTurn, 1000);
        } else {
          await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), { dice: newDice, hasRolled: true, sixCount: newSixCount });
        }
    }, 1000);
  }

  async function handlePieceClick(color, pieceId) {
    if (ludoState.turn !== currentUser || !ludoState.hasRolled || color !== myColor || isProcessing) return;
    
    const dice = ludoState.dice;
    const pos = ludoState[color][pieceId];
    
    let newPos = pos;
    let isValidMove = false;
    
    if (pos === -1 && dice === 6) { newPos = 0; isValidMove = true; }
    else if (pos >= 0 && pos + dice <= 56) { newPos = pos + dice; isValidMove = true; }
    
    if (isValidMove) {
      isProcessing = true;
      
      let updates = {};
      updates[`${color}.${pieceId}`] = newPos;
      
      let newAbsIndex = -1;
      if (newPos < 51) {
          let offset = color === 'red' ? 0 : 26;
          newAbsIndex = (newPos + offset) % 52;
      }

      if (newAbsIndex !== -1) {
          const oppPieces = ludoState[oppColor];
          for (let op in oppPieces) {
            const oppPos = oppPieces[op];
            if (oppPos >= 0 && oppPos < 51) {
               let oppOffset = color === 'red' ? 26 : 0;
               let oppAbsIndex = (oppPos + oppOffset) % 52;
               if (oppAbsIndex === newAbsIndex && !isSafeCell(newAbsIndex)) {
                 updates[`${oppColor}.${op}`] = -1;
               }
            }
          }
      }
      
      let win = true;
      for (let p in ludoState[color]) {
        if (p === pieceId) { if (newPos !== 56) win = false; }
        else { if (ludoState[color][p] !== 56) win = false; }
      }
      
      if (win) {
        updates['winner'] = currentUser;
        updates['dice'] = 0;
        updates['hasRolled'] = false;
      } else {
        if (dice !== 6) {
            updates['turn'] = ludoState.turn === currentUser ? partnerName : currentUser;
            updates['dice'] = 0;
            updates['hasRolled'] = false;
            updates['sixCount'] = 0;
        } else {
            updates['dice'] = 0;
            updates['hasRolled'] = false;
        }
      }
      
      try {
          await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), updates);
      } catch(e) {
          console.error(e);
          showModal("Error", "Could not move piece. Check connection.");
      } finally {
          isProcessing = false;
      }
    }
  }

  function isSafeCell(absIndex) {
    return [0, 8, 13, 21, 26, 34, 39, 47].includes(absIndex);
  }

  async function passTurn() {
    if (ludoState.winner) return;
    await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), {
      turn: ludoState.turn === currentUser ? partnerName : currentUser,
      dice: 0,
      hasRolled: false,
      sixCount: 0
    });
  }

  async function leaveLudo() {
    if (unsubLudo) unsubLudo();
    if (unsubUsers) unsubUsers();
    
    // Bug Fix: Reset room status so guests can join again
    if (isHost) {
        await updateDoc(doc(db, "rooms", roomId), { gameState: { status: 'lobby' } });
    }
    window.location.href = "index.html";
    return;
  }

  window.rollDice = rollDice;
  window.leaveLudo = leaveLudo;
  window.restartLudo = restartLudo;

  initGame();

</script>
</body>
</html>
