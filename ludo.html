<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shizu Ludo</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root { 
      --bg: #100B12; 
      --bg-sec: #19111C;
      --card: #211722; 
      --primary: #E879A5; 
      --secondary: #B96A91;
      --text: #F8EAF0; 
      --muted: #A99AA5; 
      --border: rgba(232, 121, 165, 0.16); 
      --green: #4CAF50;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: 'Inter', sans-serif; 
      text-align: center; 
      padding: 20px; 
      background: var(--bg); 
      color: var(--text); 
      margin: 0; 
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 { 
      font-family: 'Playfair Display', serif; 
      color: var(--primary); 
      font-size: 2.2rem; 
      margin-bottom: 5px;
    }
    
    .container { max-width: 450px; margin: 0 auto; width: 100%; }
    
    .status-text { 
      color: var(--primary); 
      font-weight: 600; 
      font-size: 1.1rem; 
      margin-bottom: 20px;
      min-height: 25px;
    }
    
    .btn { 
      background: transparent; 
      color: var(--text); 
      border: 1px solid var(--border); 
      padding: 16px; 
      margin: 8px 0; 
      border-radius: 12px; 
      font-family: 'Inter', sans-serif;
      font-size: 16px; 
      font-weight: 500; 
      cursor: pointer; 
      width: 100%; 
      transition: all 0.2s ease; 
      min-height: 44px;
    }
    .btn:active { transform: scale(0.97); }
    
    /* The Board Container */
    .board-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
      margin-bottom: 20px;
    }

    /* Your Uploaded Board Image */
    .board-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('ludo-board.jpg');
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    /* The 3D Pawn Container */
    .piece {
      position: absolute;
      width: 10%; /* Slightly larger to fit the ring */
      height: 15%; /* Taller to accommodate the 3D shape */
      background-image: url('red-piece.png'); /* Base image is red */
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 10;
      /* Shift up so the base of the pawn touches the grid point */
      transform: translate(-50%, -85%); 
    }

    /* Magic CSS Filter to turn the transparent red pawn green! */
    .piece-green {
      filter: hue-rotate(120deg) saturate(1.5);
    }

    /* The Profile Picture inside the top ring */
    .piece-avatar {
      position: absolute;
      top: 13%; /* Fits exactly inside the top ring of the 3D image */
      left: 50%;
      transform: translateX(-50%);
      width: 45%; 
      aspect-ratio: 1; 
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      background-color: #222; /* Fallback if image fails */
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.8); /* Makes it look recessed */
    }

    /* Glow when it's a valid move */
    .piece.my-turn { 
        cursor: pointer; 
        transform: translate(-50%, -85%) scale(1.15); 
        z-index: 20; 
        filter: drop-shadow(0px 0px 10px var(--primary)) hue-rotate(0deg); 
    }
    .piece-green.my-turn {
        filter: drop-shadow(0px 0px 10px var(--primary)) hue-rotate(120deg) saturate(1.5); 
    }

    /* Dice Area */
    .dice-container { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 20px; 
      margin-top: 10px;
    }
    .dice { 
      width: 70px; 
      height: 70px; 
      background: var(--bg-sec); 
      color: var(--primary); 
      border: 2px solid var(--border);
      font-size: 36px; 
      border-radius: 12px; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      cursor: pointer; 
      box-shadow: 0 5px 0 var(--card); 
      transition: 0.1s; 
    }
    .dice:active:not(.disabled) { 
      transform: translateY(5px); 
      box-shadow: 0 0 0 var(--card); 
    }
    .dice.disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
      background: var(--card); 
    }
    
    #diceResult {
      color: var(--muted);
      font-weight: 600;
      font-size: 1.2rem;
      width: 80px;
      text-align: left;
    }

    /* Back button */
    .back-btn {
      margin-top: 30px;
      border-color: transparent;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Ludo</h1>
  <div class="status-text" id="ludoTurnText">Loading...</div>
  
  <div class="board-wrapper">
    <div class="board-bg"></div>
    <div id="pieces-container"></div>
  </div>
  
  <div class="dice-container">
    <div class="dice" id="diceBtn" onclick="rollDice()">🎲</div>
    <div id="diceResult"></div>
  </div>

  <button class="btn back-btn" onclick="leaveLudo()">Leave Game</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAQg9F4Sn3GsZOghWxSJqwbLMsJetvo03w",
    authDomain: "shizu-c984a.firebaseapp.com",
    projectId: "shizu-c984a",
    storageBucket: "shizu-c984a.firebasestorage.app",
    messagingSenderId: "512395203618",
    appId: "1:512395203618:web:496a2f959a3545975c667b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const currentUser = localStorage.getItem('shizu_user');
  const roomId = localStorage.getItem('shizu_room');
  const partnerName = localStorage.getItem('shizu_partner');
  
  if (!currentUser || !roomId) {
      window.location.href = "index.html";
  }

  const isHost = currentUser.toLowerCase() < partnerName.toLowerCase();
  const myColor = isHost ? 'red' : 'green';
  const oppColor = isHost ? 'green' : 'red';

  let myAvatar = '', oppAvatar = '';
  let ludoState = {};
  let unsubLudo, unsubUsers;

  // --- EXACT 15x15 GRID COORDINATES ---
  const TRACK = [
    {r:7, c:2}, {r:7, c:3}, {r:7, c:4}, {r:7, c:5}, {r:7, c:6}, 
    {r:6, c:7}, {r:5, c:7}, {r:4, c:7}, {r:3, c:7}, {r:2, c:7}, {r:1, c:7}, 
    {r:1, c:8}, {r:1, c:9}, 
    {r:2, c:9}, {r:3, c:9}, {r:4, c:9}, {r:5, c:9}, {r:6, c:9}, 
    {r:7, c:10}, {r:7, c:11}, {r:7, c:12}, {r:7, c:13}, {r:7, c:14}, {r:7, c:15}, 
    {r:8, c:15}, 
    {r:9, c:15}, 
    {r:9, c:14}, {r:9, c:13}, {r:9, c:12}, {r:9, c:11}, {r:9, c:10}, 
    {r:10, c:9}, {r:11, c:9}, {r:12, c:9}, {r:13, c:9}, {r:14, c:9}, {r:15, c:9}, 
    {r:15, c:8}, {r:15, c:7}, 
    {r:14, c:7}, {r:13, c:7}, {r:12, c:7}, {r:11, c:7}, {r:10, c:7}, 
    {r:9, c:6}, {r:9, c:5}, {r:9, c:4}, {r:9, c:3}, {r:9, c:2}, {r:9, c:1}, 
    {r:8, c:1}, 
    {r:7, c:1}  
  ];

  const HOME_RED = [{r:7, c:8}, {r:6, c:8}, {r:5, c:8}, {r:4, c:8}, {r:3, c:8}, {r:2, c:8}];
  const HOME_GREEN = [{r:9, c:8}, {r:10, c:8}, {r:11, c:8}, {r:12, c:8}, {r:13, c:8}, {r:14, c:8}];

  const BASE_RED = [{r:2.5, c:2.5}, {r:2.5, c:4.5}, {r:4.5, c:2.5}, {r:4.5, c:4.5}];
  const BASE_GREEN = [{r:11.5, c:11.5}, {r:11.5, c:13.5}, {r:13.5, c:11.5}, {r:13.5, c:13.5}];

  async function initGame() {
    const gameRef = doc(db, "rooms", roomId, "games", "ludo");
    const gameSnap = await getDoc(gameRef);
    
    if (!gameSnap.exists() || gameSnap.data().winner) {
      await setDoc(gameRef, {
        turn: isHost ? currentUser : partnerName,
        dice: 0,
        hasRolled: false,
        red: { p1: -1, p2: -1, p3: -1, p4: -1 },
        green: { p1: -1, p2: -1, p3: -1, p4: -1 },
        winner: null
      });
    }

    unsubUsers = onSnapshot(doc(db, "users", currentUser.toLowerCase()), (snap) => {
        if(snap.exists() && snap.data().avatar) myAvatar = snap.data().avatar;
        renderBoard();
    });
    onSnapshot(doc(db, "users", partnerName.toLowerCase()), (snap) => {
        if(snap.exists() && snap.data().avatar) oppAvatar = snap.data().avatar;
        renderBoard();
    });

    unsubLudo = onSnapshot(gameRef, (docSnap) => {
      if (docSnap.exists()) {
        ludoState = docSnap.data();
        renderBoard();
      }
    });
  }

  function renderBoard() {
    const container = document.getElementById('pieces-container');
    if (!container || !ludoState.red) return;
    container.innerHTML = '';

    for (let p in ludoState.red) {
      const pos = ludoState.red[p];
      let gridPos;
      
      if (pos === -1) gridPos = BASE_RED[parseInt(p.slice(1))-1];
      else if (pos >= 0 && pos <= 51) gridPos = TRACK[pos]; 
      else gridPos = HOME_RED[pos - 52];
      
      createPieceElement('red', p, gridPos);
    }

    for (let p in ludoState.green) {
      const pos = ludoState.green[p];
      let gridPos;
      
      if (pos === -1) gridPos = BASE_GREEN[parseInt(p.slice(1))-1];
      else if (pos >= 0 && pos <= 51) gridPos = TRACK[(pos + 26) % 52]; 
      else gridPos = HOME_GREEN[pos - 52];
      
      createPieceElement('green', p, gridPos);
    }

    const diceBtn = document.getElementById('diceBtn');
    if (ludoState.winner) {
      document.getElementById('ludoTurnText').innerText = `🏆 ${ludoState.winner} Wins!`;
      diceBtn.classList.add('disabled');
    } else if (ludoState.turn === currentUser) {
      document.getElementById('ludoTurnText').innerText = "Your Turn!";
      diceBtn.classList.toggle('disabled', ludoState.hasRolled);
    } else {
      document.getElementById('ludoTurnText').innerText = `Waiting for ${partnerName}...`;
      diceBtn.classList.add('disabled');
    }
    
    if (ludoState.dice > 0) document.getElementById('diceResult').innerText = `Rolled: ${ludoState.dice}`;
    else document.getElementById('diceResult').innerText = "";
  }

  function createPieceElement(color, pieceId, gridPos) {
    const el = document.createElement('div');
    el.className = `piece piece-${color}`;
    
    el.style.left = `${((gridPos.c - 0.5) / 15) * 100}%`;
    el.style.top = `${((gridPos.r - 0.5) / 15) * 100}%`;

    const avatarDiv = document.createElement('div');
    avatarDiv.className = 'piece-avatar';

    let imageToUse = '';
    if (color === 'red' && myColor === 'red') imageToUse = myAvatar;
    if (color === 'red' && oppColor === 'red') imageToUse = oppAvatar;
    if (color === 'green' && myColor === 'green') imageToUse = myAvatar;
    if (color === 'green' && oppColor === 'green') imageToUse = oppAvatar;

    if (imageToUse) {
      avatarDiv.style.backgroundImage = `url(${imageToUse})`;
    }
    el.appendChild(avatarDiv);

    if (color === myColor && ludoState.turn === currentUser && ludoState.hasRolled && !ludoState.winner) {
        el.classList.add('my-turn');
        el.onclick = () => handlePieceClick(color, pieceId);
    }

    document.getElementById('pieces-container').appendChild(el);
  }

  async function rollDice() {
    if (ludoState.turn !== currentUser || ludoState.hasRolled) return;
    
    const newDice = Math.floor(Math.random() * 6) + 1;
    document.getElementById('diceResult').innerText = `Rolled: ${newDice}`;
    
    const myPieces = ludoState[myColor];
    let hasValidMove = false;
    
    for (let p in myPieces) {
      const pos = myPieces[p];
      if (pos === -1 && newDice === 6) hasValidMove = true;
      else if (pos >= 0 && pos + newDice <= 56) hasValidMove = true;
    }
    
    if (!hasValidMove) {
      document.getElementById('ludoTurnText').innerText = "No valid moves. Passing...";
      await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), { dice: newDice, hasRolled: true });
      setTimeout(passTurn, 1000);
    } else {
      await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), { dice: newDice, hasRolled: true });
    }
  }

  async function handlePieceClick(color, pieceId) {
    if (ludoState.turn !== currentUser || !ludoState.hasRolled || color !== myColor) return;
    
    const dice = ludoState.dice;
    const pos = ludoState[color][pieceId];
    
    let newPos = pos;
    let isValidMove = false;
    
    if (pos === -1 && dice === 6) { newPos = 0; isValidMove = true; }
    else if (pos >= 0 && pos + dice <= 56) { newPos = pos + dice; isValidMove = true; }
    
    if (isValidMove) {
      let newAbsIndex = -1;
      if (newPos < 52) {
          let offset = color === 'red' ? 0 : 26;
          newAbsIndex = (newPos + offset) % 52;
      }

      const oppPieces = ludoState[oppColor];
      
      if (newAbsIndex !== -1) {
          for (let op in oppPieces) {
            const oppPos = oppPieces[op];
            if (oppPos >= 0 && oppPos < 52) {
               let oppOffset = color === 'red' ? 26 : 0;
               let oppAbsIndex = (oppPos + oppOffset) % 52;
               if (oppAbsIndex === newAbsIndex && !isSafeCell(newAbsIndex)) {
                 await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), { [`${oppColor}.${op}`]: -1 });
               }
            }
          }
      }
      
      let win = true;
      for (let p in ludoState[color]) {
        if (p === pieceId) { if (newPos !== 56) win = false; }
        else { if (ludoState[color][p] !== 56) win = false; }
      }
      
      if (win) {
        await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), { [`${color}.${pieceId}`]: newPos, winner: currentUser });
      } else {
        await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), { [`${color}.${pieceId}`]: newPos });
        
        if (dice !== 6) {
            setTimeout(passTurn, 500);
        } else {
            await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), { hasRolled: false, dice: 0 });
        }
      }
    }
  }

  function isSafeCell(absIndex) {
    return [0, 8, 13, 21, 26, 34, 39, 47].includes(absIndex);
  }

  async function passTurn() {
    if (ludoState.winner) return;
    await updateDoc(doc(db, "rooms", roomId, "games", "ludo"), {
      turn: ludoState.turn === currentUser ? partnerName : currentUser,
      dice: 0,
      hasRolled: false
    });
  }

  function leaveLudo() {
    if (unsubLudo) unsubLudo();
    if (unsubUsers) unsubUsers();
    window.location.href = "index.html";
  }

  window.rollDice = rollDice;
  window.leaveLudo = leaveLudo;

  initGame();

</script>
</body>
</html>
