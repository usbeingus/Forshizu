<!DOCTYPE html><html lang="en"><head><title>Watch Together</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#100B12">
<style>
:root{--bg:#100B12;--bg2:#19111C;--card:#211722;--pri:#E879A5;--text:#F8EAF0;--muted:#A99AA5;--bd:rgba(232,121,165,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 12px calc(16px + env(safe-area-inset-bottom) + var(--chat-h,0px));transition:padding-bottom .3s;background:radial-gradient(60% 40% at 12% 0%,rgba(232,121,165,.16),transparent 70%),radial-gradient(50% 40% at 100% 100%,rgba(120,80,200,.12),transparent 70%),var(--bg)}
h1{margin:0;font:600 1.5rem Georgia,serif;color:var(--pri);flex:1}
button{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;transition:transform .15s,background .2s}
button:active:not(:disabled){transform:scale(.94)}button:disabled{opacity:.4;cursor:default}button.pri{background:linear-gradient(135deg,#C2477E,#9B3A6B);border-color:#C2477E}
button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.top,.bar,#stage,#msg,.react,.src{width:100%;max-width:760px}
.top{display:flex;align-items:center;gap:10px}.pres{width:12px;height:12px;border-radius:50%;background:#555;transition:all .3s}.pres.on{background:#4cd97b;box-shadow:0 0 10px #4cd97b}
.bar{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:var(--bg2);color:var(--text);border:1px solid var(--bd);border-radius:12px;padding:12px;font:16px system-ui;outline:none}input[type=text]:focus{border-color:var(--pri)}
.src{font-size:12px;color:var(--muted);text-align:center}
#stage{position:relative;background:#000;border-radius:16px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px var(--bd)}
#player{aspect-ratio:16/9;width:100%;background:radial-gradient(circle,#2a1a2e,#000)}#player video,#player iframe{width:100%;height:100%;border:0;display:block;background:#000}#player iframe{pointer-events:none}
#ov{position:absolute;inset:0 0 54px 0;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;z-index:3;background:rgba(16,11,18,.88);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fadeIn .3s}
#ov.hidden,.hidden{display:none!important}#ov.count{background:rgba(16,11,18,.55)}@keyframes fadeIn{from{opacity:0}}
#ov .empty{color:var(--muted);line-height:1.7;font-size:1.05rem}#ov .empty small{font-size:12px}
#ov .card{max-width:340px;display:flex;flex-direction:column;gap:10px;align-items:center}#ov .card p{margin:0;color:var(--muted);font-size:14px}
#ov a{color:#fff;background:#C2477E;border-radius:12px;padding:12px 18px;text-decoration:none;font-weight:600}
#ov .tap{font-size:1.15rem;padding:16px 26px;animation:tp 1.6s ease-in-out infinite}@keyframes tp{50%{transform:scale(1.06);box-shadow:0 0 22px rgba(232,121,165,.6)}}
#ov .big{font:700 6rem Georgia,serif;color:var(--pri);text-shadow:0 0 30px rgba(232,121,165,.8);animation:cd 1s ease-out infinite}#ov .big.go{color:#4cd97b;animation:cd .6s ease-out}@keyframes cd{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.ctl{display:flex;align-items:center;gap:6px;padding:6px;background:var(--bg2);min-height:54px}.ctl button{padding:6px 10px;min-height:40px}
#seek{flex:1;min-width:0;accent-color:#E879A5}#tm{font-size:12px;color:var(--muted);min-width:78px;text-align:center}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}#fx span{position:absolute;bottom:62px;font-size:32px;animation:fl 2.4s ease-out forwards}@keyframes fl{to{transform:translateY(-230px) scale(1.5) rotate(var(--r,0deg));opacity:0}}
.react{display:flex;gap:8px;justify-content:center}.react button{font-size:22px;padding:6px 14px;border-radius:22px}
#msg{color:var(--muted);font-size:14px;text-align:center;min-height:20px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--card);border:1px solid var(--pri);padding:10px 16px;border-radius:12px;z-index:50}
@media (prefers-reduced-motion:reduce){#ov,#ov .tap,#ov .big{animation:none!important}}
</style></head><body>
<div class="top"><button id="back" aria-label="Back">←</button><h1>Watch Together</h1><span id="pres" class="pres" role="img" aria-label="Partner status"></span></div>
<div class="bar"><input type="text" id="url" inputmode="url" aria-label="Video link" placeholder="Paste any video link…"><button class="pri" id="load">Load</button><button id="pick" aria-label="Play a video file from this device">📁</button><input type="file" id="file" accept="video/*,audio/*" hidden></div>
<div class="src">YouTube · Vimeo · direct video / stream links · or your own file 📁</div>
<div id="stage"><div id="player"></div><div id="ov"></div><div id="fx"></div>
<div class="ctl"><button id="pp" aria-label="Play or pause" disabled>▶</button><button id="b10" aria-label="Back 10 seconds" disabled>−10</button><button id="f10" aria-label="Forward 10 seconds" disabled>+10</button><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek" disabled><span id="tm">0:00</span><button id="mute" aria-label="Mute">🔊</button><button id="fs" aria-label="Fullscreen">⛶</button></div></div>
<div class="react" aria-label="Reactions"><button data-e="❤️">❤️</button><button data-e="🔥">🔥</button><button data-e="😂">😂</button><button data-e="😮">😮</button><button data-e="👏">👏</button><button data-e="😘">😘</button></div>
<div id="msg" aria-live="polite"></div><div id="toast" class="hidden" role="status"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getFirestore,doc,setDoc,onSnapshot,getDocFromServer,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import {initChat} from './chat.js';
const firebaseConfig = {
    apiKey: "AIzaSyAQg9F4Sn3GsZOghWxSJqwbLMsJetvo03w",
    authDomain: "shizu-c984a.firebaseapp.com",
    projectId: "shizu-c984a",
    storageBucket: "shizu-c984a.firebasestorage.app",
    messagingSenderId: "512395203618",
    appId: "1:512395203618:web:496a2f959a3545975c667b"
  };
const db=getFirestore(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const me=localStorage.getItem('shizu_user'),roomId=localStorage.getItem('shizu_room'),partner=localStorage.getItem('shizu_partner')||'partner';
if(!me||!roomId){location.replace('index.html');throw new Error('no session');}
const wref=n=>doc(db,'rooms',roomId,'games',n),watchRef=wref('watch'),reactRef=wref('wreact'),roomRef=doc(db,'rooms',roomId);
let S=null,A=null,off=0,unlocked=false,drag=false,building=0,localFile=null,localUrl=null,muted=false,pickMode='load',lastOv='',goFired=0,pt=0;
const now=()=>Date.now()+off,msg=t=>$('msg').textContent=t||'';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),2500);};
const scripts={};const loadScript=u=>scripts[u]||(scripts[u]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s);}));
async function calibrate(){try{const p=wref('ping_'+me.toLowerCase());await setDoc(p,{t:serverTimestamp()});const s=await getDocFromServer(p);off=s.data().t.toMillis()-Date.now();}catch(e){off=0;}}
const YT=/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/;
function parse(u){u=(u||'').trim();let m;if(m=u.match(YT))return{kind:'yt',id:m[1]};if(m=u.match(/vimeo\.com\/(?:.*\/)?(\d{6,})/))return{kind:'vimeo',id:m[1]};
  if(!/^https?:\/\/[^\s]+$/i.test(u))return null;if(/\.m3u8([?#].*)?$/i.test(u))return{kind:'hls'};
  if(/\.(mp4|webm|ogv|ogg|mov|m4v|mp3|m4a|wav|aac|flac)([?#].*)?$/i.test(u))return{kind:'file'};return{kind:'ext'};}
const html=v=>({play:()=>v.play().catch(()=>{}),pause:()=>v.pause(),seek:t=>{v.currentTime=t;},time:()=>v.currentTime||0,playing:()=>!v.paused&&!v.ended,dur:()=>isFinite(v.duration)?v.duration:0,mute:()=>(muted=v.muted=!v.muted),rate:r=>{if(v.playbackRate!==r)v.playbackRate=r;}});
const ytReady=()=>new Promise(r=>{if(window.YT&&YT.Player)return r();window.onYouTubeIframeAPIReady=r;loadScript('https://www.youtube.com/iframe_api').catch(()=>msg('Could not load YouTube.'));});
async function build(){
  const id=++building;A=null;$('player').innerHTML='';unlocked=false;msg('');
  if(!S||!S.kind||S.kind==='ext'){return;}
  const k=S.kind;let src=k==='local'?(localFile?localUrl:null):(k==='file'||k==='hls')?S.url:null;
  if(k==='local'&&!localFile)return;
  if(src){
    const v=document.createElement('video');v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';
    v.onerror=()=>{if(id===building)msg('Could not play this video (blocked by the site, wrong format, or no permission).');};
    if(k==='hls'&&!v.canPlayType('application/vnd.apple.mpegurl')){
      try{await loadScript('https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js');}catch(e){msg('Could not load the stream player.');return;}
      if(id!==building)return;if(!(window.Hls&&Hls.isSupported())){msg('This stream is not supported in your browser.');return;}
      const h=new Hls();h.loadSource(src);h.attachMedia(v);
    }else v.src=src;
    $('player').appendChild(v);A=html(v);
  }else if(k==='yt'){
    await ytReady();if(id!==building)return;const d=document.createElement('div');$('player').appendChild(d);
    const yt=await new Promise(res=>{const p=new YT.Player(d,{videoId:parse(S.url).id,playerVars:{controls:0,playsinline:1,rel:0,disablekb:1,modestbranding:1,iv_load_policy:3},events:{onReady:()=>res(p),onError:()=>msg('This video cannot be embedded (the owner blocked it).')}});});
    if(id!==building)return;
    A={play:()=>yt.playVideo(),pause:()=>yt.pauseVideo(),seek:t=>yt.seekTo(t,true),time:()=>yt.getCurrentTime()||0,playing:()=>yt.getPlayerState()===1,dur:()=>yt.getDuration()||0,mute:()=>{yt.isMuted()?yt.unMute():yt.mute();return(muted=yt.isMuted());}};
  }else if(k==='vimeo'){
    try{await loadScript('https://player.vimeo.com/api/player.js');}catch(e){msg('Could not load Vimeo.');return;}
    if(id!==building)return;const f=document.createElement('iframe');f.src=`https://player.vimeo.com/video/${parse(S.url).id}?controls=0&playsinline=1&dnt=1`;f.allow='autoplay; fullscreen';$('player').appendChild(f);
    const vp=new Vimeo.Player(f);let t=0,pl=false,du=0;vp.on('timeupdate',d=>{t=d.seconds;du=d.duration;});vp.on('play',()=>pl=true);vp.on('pause',()=>pl=false);vp.on('ended',()=>pl=false);
    try{await vp.ready();du=await vp.getDuration();}catch(e){msg('This Vimeo video cannot be embedded.');return;}
    if(id!==building)return;
    A={play:()=>vp.play().catch(()=>{}),pause:()=>vp.pause().catch(()=>{}),seek:x=>{vp.setCurrentTime(x).catch(()=>{});t=x;},time:()=>t,playing:()=>pl,dur:()=>du,mute:()=>{muted=!muted;vp.setVolume(muted?0:1);return muted;}};
  }
  apply();
}
const target=s=>s.pos+(s.playing?Math.max(0,(now()-s.at)/1000):0);
function apply(){
  if(!A||!S||!unlocked)return;const t=target(S),dur=A.dur(),end=dur&&t>=dur-.3;
  if(end){if(A.time()<dur-.6)A.seek(Math.max(0,dur-.2));A.pause();return;}const d=A.time()-t;
  if(Math.abs(d)>1.5){A.seek(t);A.rate&&A.rate(1);}else if(A.rate)A.rate(S.playing&&Math.abs(d)>.25?(d>0?.94:1.06):1);
  if(S.playing&&!A.playing())A.play();else if(!S.playing&&A.playing())A.pause();
}
function ov(h,c){if(h===lastOv)return;lastOv=h;const o=$('ov');o.innerHTML=h;o.className=h?(c||''):'hidden';}
function refreshOv(){
  if(S&&S.go&&now()<S.go+1200){const n=Math.ceil((S.go-now())/1000);if(n<=0&&goFired!==S.go){goFired=S.go;try{navigator.vibrate&&navigator.vibrate([60,40,60]);}catch(e){}}return ov(n>0?`<div class="big" data-n="${n}">${n}</div>`:'<div class="big go">GO!</div>','count');}
  if(!S||!S.kind)return ov('<div class="empty">🎬<br>Paste a link or pick a file<br><small>Either of you can start — the other’s screen follows</small></div>');
  if(S.kind==='ext'){let h='site';try{h=new URL(S.url).hostname;}catch(e){}return ov(`<div class="card"><b>${esc(h)}</b><p>${esc(S.by)} shared a page that can’t be embedded. Open it on both phones, then start together.</p><a href="${esc(S.url)}" target="_blank" rel="noopener noreferrer">Open ↗</a><button data-act="cd">⏱ Start together in 5s</button></div>`);}
  if(S.kind==='local'&&!localFile)return ov(`<div class="card"><b>${esc(S.name)}</b><p>${esc(S.by)} picked a file from their device. Choose the same file on yours.</p><button class="pri" data-act="joinf">📁 Choose the file</button></div>`);
  if(A&&!unlocked)return ov('<button class="pri tap" data-act="tap">▶ Tap to join playback</button>');
  ov('');
}
function ui(){
  refreshOv();const on=!!A&&unlocked;['pp','b10','f10','seek'].forEach(i=>$(i).disabled=!on);
  $('pres').className='pres'+(pt&&now()-pt<22000?' on':'');$('pres').title=pt&&now()-pt<22000?`${partner} is here`:`${partner} is not on this page`;
  if(!A||!S)return;$('pp').textContent=S.playing?'⏸':'▶';const d=A.dur();$('tm').textContent=fmt(A.time())+(d?' / '+fmt(d):'');if(!drag&&d)$('seek').value=Math.round(A.time()/d*1000);
}
const put=o=>setDoc(watchRef,{...S,...o,at:now(),by:me,seq:((S&&S.seq)||0)+1}).catch(()=>toast('Connection problem'));
function unlock(){if(!A)return;unlocked=true;A.play();if(!S.playing)setTimeout(()=>A.pause(),80);apply();ui();}
$('ov').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;if(act==='tap')unlock();if(act==='cd')put({go:now()+5000});if(act==='joinf'){pickMode='join';$('file').click();}});
$('load').onclick=async()=>{const u=$('url').value.trim();if(!u)return;const p=parse(u);if(!p){msg('That does not look like a web link.');return;}
  await put({url:u,kind:p.kind,name:'',size:0,playing:false,pos:0,go:0});setDoc(roomRef,{watchPing:{by:me,ts:Date.now()}},{merge:true}).catch(()=>{});$('url').value='';};
$('pick').onclick=()=>{pickMode='load';$('file').click();};
$('file').onchange=async()=>{const f=$('file').files[0];$('file').value='';if(!f)return;if(localUrl)URL.revokeObjectURL(localUrl);localFile=f;localUrl=URL.createObjectURL(f);
  if(pickMode==='join'&&S&&S.kind==='local'){if(S.size&&S.size!==f.size)msg('This file looks different from the one shared — sync may be off.');build();return;}
  await put({url:'',kind:'local',name:f.name,size:f.size,playing:false,pos:0,go:0});setDoc(roomRef,{watchPing:{by:me,ts:Date.now()}},{merge:true}).catch(()=>{});};
$('pp').onclick=()=>{const d=A.dur();put({playing:!S.playing,pos:(d&&A.time()>=d-.6)?0:A.time()});};
$('b10').onclick=()=>put({pos:Math.max(0,A.time()-10)});$('f10').onclick=()=>put({pos:A.time()+10});
$('seek').oninput=()=>{drag=true;};$('seek').onchange=()=>{drag=false;const d=A.dur();if(d)put({pos:$('seek').value/1000*d});};
$('mute').onclick=()=>{if(A)$('mute').textContent=A.mute()?'🔇':'🔊';};
$('fs').onclick=()=>{const e=$('stage');(e.requestFullscreen||e.webkitRequestFullscreen||(()=>{})).call(e);};
$('back').onclick=()=>location.href='index.html';
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')$('load').click();});
function floatE(e){const s=document.createElement('span');s.textContent=e;s.style.left=10+Math.random()*80+'%';s.style.setProperty('--r',(Math.random()*50-25)+'deg');$('fx').appendChild(s);setTimeout(()=>s.remove(),2500);}
document.querySelector('.react').addEventListener('click',e=>{const b=e.target.closest('button[data-e]');if(!b)return;floatE(b.dataset.e);setDoc(reactRef,{e:b.dataset.e,by:me,ts:Date.now()}).catch(()=>{});});
let firstR=true;onSnapshot(reactRef,s=>{const d=s.data();if(firstR){firstR=false;return;}if(d&&d.by!==me){floatE(d.e);floatE(d.e);}},()=>{});
onSnapshot(wref('wp_'+partner.toLowerCase()),s=>{const d=s.data();pt=d?d.t:0;},()=>{});
const beat=()=>setDoc(wref('wp_'+me.toLowerCase()),{t:now()}).catch(()=>{});
onSnapshot(watchRef,snap=>{const n=snap.data();if(!n)return;const ch=!S||n.url!==S.url||n.kind!==S.kind||n.name!==S.name||n.size!==S.size;S=n;if(ch){lastOv='';build().then(apply);}else{apply();}ui();},()=>toast('Connection lost'));
initChat({db,roomId,me,partner});
setInterval(apply,1000);setInterval(ui,200);setInterval(beat,8000);calibrate().then(beat);ui();
</script></body></html>
